name: CI

# 每次 push 到 main 与每个 PR 的质量门：Rust fmt/clippy/test，脚本与工作流静态检查。
# main 上 CI 通过后由 release.yml（workflow_run）决定是否发版。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  ACTIONLINT_VERSION: '1.7.12'

jobs:
  scripts:
    name: Scripts and workflows lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --version | head -2
          git ls-files '*.sh' | xargs shellcheck

      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

      - name: Release script self-test
        run: |
          set -euo pipefail
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          .github/scripts/release-test.sh

  rust:
    name: Rust fmt, clippy -D warnings, test
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 工具链与组件只看 rust-toolchain.toml（channel + clippy/rustfmt）。
      - name: Install Rust from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc -vV
          cargo clippy -V
          cargo fmt --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # PR 缓存只在 refs/pull/N/merge 可见、不会复用；只在 main 保存
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (strict)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --no-fail-fast
