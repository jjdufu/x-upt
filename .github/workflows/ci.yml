name: CI

# 每次 push 到 main 与每个 PR 的质量门：脚本与契约静态守卫、前端构建审计、Rust 全量门禁。
# main 上 CI 通过后由 release.yml（workflow_run）决定是否发版。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  ACTIONLINT_VERSION: '1.7.12'

jobs:
  scripts:
    name: Scripts, guards and workflows lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --version | head -2
          git ls-files '*.sh' | xargs shellcheck

      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

      - name: Static guards (G1)
        run: |
          set -euo pipefail
          python3 scripts/lint-guard.py
          python3 scripts/web-guard.py
          python3 scripts/docs-and-plans-guard.py
          python3 scripts/check_routes.py

      - name: Release script self-test
        run: |
          set -euo pipefail
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          .github/scripts/release-test.sh

  frontend:
    name: WebUI lint, typecheck, test and build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        run: |
          set -euo pipefail
          npm install --prefix "$HOME/.local" -g pnpm@12.21.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          node -v
          pnpm -v

      - name: Install, lint, typecheck, test and build web/
        working-directory: web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Audit embedded bundle (embed-guard)
        run: python3 scripts/embed-guard.py

      - name: Upload web/dist bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  rust:
    name: Rust fmt, clippy -D warnings, test and doc
    needs: frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download web/dist bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - name: Install Rust from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc -vV
          cargo clippy -V
          cargo fmt --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (strict)
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      - name: Rustdoc (-D warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
