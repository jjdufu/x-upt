[package]
name = "upupt"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1.2"
base64 = "0.23"
rand = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
hmac = "0.13"
sha2 = { version = "0.11", features = ["oid"] }
md-5 = "0.11"
hex = "0.4"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
subtle = "2"
url = "2"
async-graphql = { version = "=7.0.16", features = ["dynamic-schema"] }
async-graphql-axum = "=7.0.16"
async-graphql-derive = "=7.0.16"
async-graphql-parser = "=7.0.16"
async-graphql-value = "=7.0.16"
tonic = { version = "0.13", features = ["transport"] }
prost = "0.13"
quick-xml = "0.37"
futures-util = "0.3"
bytes = "1"
http = "1"
aes = "0.9"
aes-gcm = "0.11"
des = "0.9"
cipher = "0.5"
libsm = "0.6"
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "getrandom", "hazmat", "pkcs1v15"] }

[build-dependencies]
tonic-build = "0.13"
prost = "0.13"
prost-types = "0.13"
protoc-bin-vendored = "3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 2
debug-assertions = true
overflow-checks = true
rpath = true
