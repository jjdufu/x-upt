[workspace]
members = [
    "crates/x-upt-core",
    "crates/x-upt-crypto",
    "crates/x-upt-store",
    "crates/x-upt-fronts",
    "crates/x-upt",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
x-upt-core = { version = "0.1.0", path = "crates/x-upt-core" }
x-upt-crypto = { version = "0.1.0", path = "crates/x-upt-crypto" }
x-upt-store = { version = "0.1.0", path = "crates/x-upt-store" }
x-upt-fronts = { version = "0.1.0", path = "crates/x-upt-fronts" }

axum = { version = "0.8", default-features = false, features = ["form", "http1", "http2", "json", "matched-path", "multipart", "original-uri", "query", "tokio", "ws"] }
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
rand = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service"] }
tower = { version = "0.5", features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
hmac = "0.13"
sha2 = { version = "0.11", features = ["oid"] }
md-5 = "0.11"
hex = "0.4"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
subtle = "2"
url = "2"
async-graphql = { version = "=7.0.16", features = ["dynamic-schema"] }
tonic = { version = "0.13", features = ["transport"] }
prost = "0.13"
quick-xml = "0.37"
bytes = "1"
http = "1"
aes = "0.9"
aes-gcm = "0.11"
des = "0.9"
cipher = "0.5"
libsm = "0.6"
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "getrandom", "hazmat", "pkcs1v15"] }
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
rust-embed = "8.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
protoc-bin-vendored = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
as_underscore = "deny"
lossy_float_literal = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
mem_forget = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
infinite_loop = "deny"
significant_drop_in_scrutinee = "deny"
non_send_fields_in_send_ty = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 2
debug-assertions = true
overflow-checks = true
rpath = true
