services:
  x-upt:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: x-upt
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      X_UPT_ADMIN_LISTEN: 0.0.0.0:18768
      X_UPT_DATA_DIR: /data
      X_UPT_ADMIN_TOKEN: ${X_UPT_ADMIN_TOKEN:-}
    ports:
      - "${X_UPT_ADMIN_PORT:-18768}:18768"
      - "16000-16008:16000-16008"
      - "16010-16015:16010-16015"
    volumes:
      - x_upt_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18768/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  x_upt_data:
